name: YouTube Music Scrobble Sync

on:
  schedule:
    - cron: '17,47 * * * *' # Every 30 minutes at odd minute offsets (:17 and :47)
  push:
    branches: [master] # Trigger on push to master branch
  workflow_dispatch: # Allows manual triggering from GitHub UI

# Prevent overlapping runs from clobbering the cached data.db
concurrency:
  group: scrobble-sync
  cancel-in-progress: false

jobs:
  scrobble:
    runs-on: ubuntu-latest
    environment: production # Binds to the 'production' environment for secrets and protection rules

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip # Replaces the manual pip cache step
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache scrobble database
        uses: actions/cache@v5
        with:
          path: data.db
          key: ${{ runner.os }}-scrobble-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-scrobble-db-${{ github.run_id }}-
            ${{ runner.os }}-scrobble-db-

      - name: Cache scrobble database
        uses: actions/cache@v5
        with:
          path: data.db
          key: ${{ runner.os }}-scrobble-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-scrobble-db-${{ github.run_id }}-
            ${{ runner.os }}-scrobble-db-

      - name: Debug auth key        # <-- add here
        env:
          YTMUSIC_AUTH_KEY: ${{ secrets.YTMUSIC_AUTH_KEY }}
        run: |
          echo "length: ${#YTMUSIC_AUTH_KEY}"
          ls -l browser.json.enc

      - name: Run YouTube Music Scrobbler
        env:
          LAST_FM_API: ${{ secrets.LAST_FM_API }}
          LAST_FM_API_SECRET: ${{ secrets.LAST_FM_API_SECRET }}
          LASTFM_SESSION: ${{ secrets.LASTFM_SESSION }}
          YTMUSIC_AUTH_KEY: ${{ secrets.YTMUSIC_AUTH_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python start_ytm_scobble.py

  notify_failure:
    needs: scrobble
    runs-on: ubuntu-latest
    if: failure()
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Send Discord failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          pip install requests
          python .github/scripts/send_failure_notification.py
